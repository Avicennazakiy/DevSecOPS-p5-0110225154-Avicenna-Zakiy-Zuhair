name: DevSecOps - SonarQube

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube SAST and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarQube URL
        run: |
          echo "SONAR_HOST_URL is configured:"
          if [ -n "${{ vars.SONAR_HOST_URL }}" ]; then
            echo "YES"
          else
            echo "NO"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}