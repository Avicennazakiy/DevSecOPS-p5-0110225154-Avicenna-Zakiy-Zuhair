{% extends "base.html" %}
{% block title %}Daftar - Mini LMS{% endblock %}
{% block content %}
<h1>Daftar akun</h1>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" required minlength="3" maxlength="30" autofocus>
  <label for="password">Password (minimal 8 karakter)</label>
  <input id="password" name="password" type="password" required minlength="8">
  <label for="role">Saya adalah</label>
  <select id="role" name="role" required>
    <option value="siswa">Siswa</option>
    <option value="pengajar">Pengajar</option>
  </select>
  <label for="teacher_code">Kode pengajar (hanya diisi jika memilih Pengajar)</label>
  <input id="teacher_code" name="teacher_code" type="password" autocomplete="off">
  <button type="submit">Daftar</button>
</form>
<p class="muted">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a>.</p>
{% endblock %}
