{% extends "base.html" %}
{% block title %}Tambah Tugas - Mini LMS{% endblock %}
{% block content %}
<h1>Tambah tugas</h1>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="title">Judul</label>
  <input id="title" name="title" required maxlength="100">
  <label for="instructions">Instruksi</label>
  <textarea id="instructions" name="instructions" rows="6" required maxlength="2000"></textarea>
  <button type="submit">Simpan tugas</button>
</form>
<p class="muted"><a href="{{ url_for('tasks.list_tasks') }}">&larr; Kembali</a></p>
{% endblock %}
